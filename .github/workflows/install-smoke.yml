name: Install smoke test

# Exercises the full single-command install path on a clean Debian
# container (headless, --yes) and asserts the stack is actually usable,
# preventing regressions in installability. systemd service management
# is unavailable inside the container, so the unit step is skipped; nginx
# is still provisioned (started without systemd) and the backend is
# health-checked both directly and through the port-80 gateway.

on:
  push:
    branches: [main]
    paths:
      - install.sh
      - apps/api/**
      - apps/web/package.json
      - apps/web/package-lock.json
      - deployment/**
      - .github/workflows/install-smoke.yml
  pull_request:
    paths:
      - install.sh
      - apps/api/**
      - apps/web/package.json
      - apps/web/package-lock.json
      - deployment/**
      - .github/workflows/install-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    container:
      image: debian:12
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run the installer (non-interactive)
        shell: bash
        run: |
          set -o pipefail
          bash install.sh --skip-systemd --skip-sap-ingest 2>&1 | tee /tmp/install.log

      - name: Assert the bootstrap summary has no FAIL lines
        run: |
          set -eux
          grep -q -- '--- Bootstrap summary ---' /tmp/install.log
          if grep -F '[FAIL]' /tmp/install.log; then exit 1; fi
          grep -F '[OK  ] nginx' /tmp/install.log

      - name: Assert provisioning artifacts
        run: |
          set -eux
          test -x apps/api/venv/bin/python
          test -x /usr/local/bin/qdrant
          test -d apps/web/.next
          test -d apps/web/src/lib/api
          test -s /etc/labish/api.env
          test -s /etc/labish/web.env
          test -s /etc/labish/keys/jwt-private.pem
          grep -q '^LABISH_DATABASE_URL=postgresql+asyncpg://labish:' /etc/labish/api.env
          grep -q '^PAYLOAD_SECRET=' /etc/labish/web.env

      - name: Assert database is migrated
        working-directory: apps/api
        run: |
          set -eux
          export $(grep -v '^#' /etc/labish/api.env | xargs)
          venv/bin/python -m alembic current | grep -q "head"

      - name: Boot the backend and health-check it
        working-directory: apps/api
        run: |
          set -eux
          apt-get install -y -qq curl
          export $(grep -v '^#' /etc/labish/api.env | xargs)
          venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          healthy=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health | grep -q '"ok"'; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [ "$healthy" != 1 ]; then
            echo "Backend never became healthy" >&2
            exit 1
          fi
          # The user-facing path: nginx gateway on port 80.
          curl -fsS http://127.0.0.1:80/health | grep -q '"ok"'
          curl -fsS http://127.0.0.1:80/api/health | grep -q '"ok"'

      - name: Re-run installer (idempotency)
        shell: bash
        run: |
          set -o pipefail
          bash install.sh --skip-systemd --skip-sap-ingest 2>&1 | tee /tmp/install-rerun.log
          if grep -F '[FAIL]' /tmp/install-rerun.log; then exit 1; fi
