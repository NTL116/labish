[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "labish-services"
version = "0.1.0"
description = "FastAPI services for Labish"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlmodel>=0.0.24,<1",
  "pyjwt[crypto]>=2.14,<3",
  "passlib[bcrypt]>=1.7.4,<2",
  # passlib 1.7.4 is incompatible with bcrypt >= 4.1 (backend self-test
  # crashes); pin bcrypt to the last compatible release line.
  "bcrypt>=4.0,<4.1",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.6,<3",
  "dramatiq[redis]>=1.17,<2",
  "redis>=5.2,<7",
  "email-validator>=2.2,<3",
  # SAP Service Layer HTTP client (integrations/sap).
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"